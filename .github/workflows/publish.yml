name: Publish
run-name: chore: release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Bump package version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a valid semver"
            exit 1
          fi

          CURRENT="$(node -p "require('./package.json').version")"
          echo "package.json is $CURRENT; tag is v$VERSION"

          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

          git fetch origin "$DEFAULT_BRANCH"
          MAIN_VERSION="$(git show "origin/${DEFAULT_BRANCH}:package.json" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")"
          if [ "$MAIN_VERSION" = "$VERSION" ]; then
            echo "origin/${DEFAULT_BRANCH} already at $VERSION, skipping version commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version files to commit"
            exit 0
          fi
          git commit -m "chore: release v${VERSION}"
          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"

      - name: Release package
        run: npm run release
