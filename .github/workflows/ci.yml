name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, build and scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Also runs `npm run scan`, which packs the tarball and applies the same
      # rules as n8n's community-package review, so a PR fails here rather than
      # at submission time.
      - name: Lint
        run: npm run lint
